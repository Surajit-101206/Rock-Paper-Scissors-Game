<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCK, PAPER, SCISSORS Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="header">
        <h2>
             ROCK, PAPER, SESSOR GAME
        </h2>
    </div>
    <div class="game">
        <div class="game_box">

            <div class="choise"id="rock">
                 <b>ROCK <br>tap</b> 
            </div>

             <div class="choise"id="paper">
                 <b>PAPER <br>tap</b> 
            </div>

             <div class="choise"id="scissor">
                 <b>SESSIOR tap</b> 
            </div>
        </div>
         
        <div class="point_table">

            <div class="user">
                  <div id="userpoint">
               <p>0</p>
            </div>
               <p><b>YOU</b></p>
            </div>

            <div class="comp">
                <div id="comppoint">
               <p>0</p>
            </div>
               <p><b>COMP</b></p>
            </div>

        </div>  
        
        <div class="msg_container">
          <div id="msg">
             Play Your Move
          </div>
        </div>
    </div>
    <div class="btn">
       <button class="reset-btn">RESET</button>
    </div> 
    <script src="script.js"></script>
</body>
</html>
